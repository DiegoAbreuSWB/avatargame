# Publica o jogo no GitHub Pages a cada push na main, espelhando o site na branch gh-pages.
# Decisão: a fonte "GitHub Actions" do Pages exige ativação manual nas configurações (o token padrão
# não pode criar o site); a fonte "branch gh-pages" é ativada automaticamente em repositórios públicos.
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,tests/out,dist'
          force_orphan: true
