<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="gl" width="1280" height="720"></canvas>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2>Avatar Arena</h2>
        <p>Pressione <b>Enter</b> ou toque para iniciar.</p>
      </div>
    </div>
  </div>
  <p id="hint">Enter = confirmar · Esc = pausar/voltar · M = som · F11 = tela cheia</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
