<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Avatar Arena - harness de testes</title>
<style>body{margin:0;background:#111}#frame{position:relative;width:1280px;height:720px}canvas{position:absolute;inset:0;display:block}#game{background:transparent}pre{color:#0f0;font:12px monospace;white-space:pre-wrap}</style>
</head><body>
<div id="frame"><canvas id="gl" width="1280" height="720"></canvas><canvas id="game" width="1280" height="720"></canvas></div>
<pre id="log">(sem saída)</pre>
<script>
/* Harness: carrega o jogo de verdade (../js), dirige a classe Game sem requestAnimationFrame e escreve um JSON em #log.
   Parâmetros no hash: mode=scenes|moves|cpu|shot|matchups|all  r=2d|3d  n=frames  p1,p2=índices  stage=índice  seed=número
   scene=cena final para captura  move=golpe  frame=frame da captura  ax,bx=posições  level=easy|normal|hard  pairs=n (matchups) */
window.__errors = []; window.__warns = [];
window.onerror = function (m, s, l, c, e) { window.__errors.push(String(m) + ' @ ' + (s || '').split('/').pop() + ':' + l + ':' + c + (e && e.stack ? '\n' + e.stack : '')); };
const _warn = console.warn; console.warn = function () { window.__warns.push([...arguments].map(String).join(' ')); _warn.apply(console, arguments); };
const _err = console.error; console.error = function () { window.__errors.push('console.error: ' + [...arguments].map((a) => a && a.stack ? a.stack : String(a)).join(' ')); _err.apply(console, arguments); };
const PARAMS = {}; (location.hash || '').slice(1).split('&').forEach((kv) => { const [k, v] = kv.split('='); if (k) PARAMS[k] = decodeURIComponent(v || ''); });
if (PARAMS.r === '3d') {
  for (const s of ['build/three.min.js', 'examples/js/shaders/CopyShader.js', 'examples/js/shaders/LuminosityHighPassShader.js', 'examples/js/postprocessing/EffectComposer.js', 'examples/js/postprocessing/RenderPass.js', 'examples/js/postprocessing/ShaderPass.js', 'examples/js/postprocessing/UnrealBloomPass.js'])
    document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/' + s + '"><\/script>');
}
</script>
<script src="../js/config.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/save.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/music.js"></script>
<script src="../js/input.js"></script>
<script src="../js/gamepad.js"></script>
<script src="../js/touch.js"></script>
<script src="../js/particles.js"></script>
<script src="../js/characters.js"></script>
<script src="../js/skins.js"></script>
<script src="../js/draw.js"></script>
<script src="../js/stages.js"></script>
<script src="../js/projectiles.js"></script>
<script src="../js/fighter.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/hud.js"></script>
<script src="../js/menus.js"></script>
<script src="../js/rig3d.js"></script>
<script src="../js/render3d.js"></script>
<script src="../js/game.js"></script>
<script src="../js/settings-ui.js"></script>
<script src="../js/modes.js"></script>
<script src="../js/content.js"></script>
<script src="../js/netplay.js"></script>
<script src="../js/online.js"></script>
<script src="../js/modifiers.js"></script>
<script src="../js/daily.js"></script>
<script src="../js/tournament.js"></script>
<script>
(function () {
  const out = { errors: window.__errors, warns: window.__warns, mode: PARAMS.mode || 'all', r: PARAMS.r || '2d', scenes: {}, moves: [], cpuFight: null, matchups: null, shot: null };
  const mode = PARAMS.mode || 'all';
  Settings.load(); Save.load();
  Settings.data.difficulty = PARAMS.level || 'normal';
  const game = new Game(document.getElementById('game'));
  window.game = game;
  const safe = (label, fn) => { try { fn(); } catch (e) { out.errors.push(label + ': ' + (e.stack || e)); } };
  if (PARAMS.r === '3d') safe('renderer', () => { game.r3d = new Renderer3D(document.getElementById('gl')); game.use3D = true; out.composer = !!game.r3d.composer; });
  const seed = parseInt(PARAMS.seed || '12345', 10);
  const draw = (i, every) => { if (i % every === 0) game.draw(); };

  if (mode === 'all' || mode === 'scenes') {
    for (const sc of ['title', 'controls', 'settings', 'select', 'stage']) {
      safe('scene ' + sc, () => { game.scene = sc; if (sc === 'settings') game.settingsIndex = 0; for (let i = 0; i < 5; i++) game.update(); game.draw(); out.scenes[sc] = 'ok'; });
    }
    safe('scene remap', () => { game.remap = { player: 'p1', index: 0, listening: false, message: '' }; game.scene = 'remap'; game.update(); game.draw(); out.scenes.remap = 'ok'; });
    safe('scenes en', () => { Settings.data.lang = 'en'; for (const sc of ['title', 'controls', 'settings', 'select', 'stage']) { game.scene = sc; game.update(); game.draw(); } Settings.data.lang = 'pt'; out.scenes.en = 'ok'; });
    safe('scene result', () => { game.mode = '2p'; game.select.p1 = 0; game.select.p2 = 1; game.seed = seed; game.startMatch(); game.winner = game.fighters[0]; game.scene = 'result'; game.resultT = 0; game.update(); game.draw(); out.scenes.result = 'ok'; });
    safe('scenes v07', () => { game.gotoRules(); game.update(); game.draw(); game.scene = 'daily'; game.update(); game.draw(); game.startTournamentSetup(); game.update(); game.draw(); game.tournament.slots.forEach((s) => { s.cpu = true; }); game.buildBracket(); game.update(); game.draw(); out.scenes.v07 = 'ok'; game.scene = 'title'; });
    safe('scene online', () => { game.online = { step: 'menu', index: 0, msg: '' }; game.scene = 'online'; game.update(); game.draw(); out.scenes.online = 'ok'; });
    safe('scene training', () => {
      game.mode = 'training'; game.select.p1 = 0; game.select.p2 = 1; game.seed = seed; game.startMatch(); game.phase = 'play'; game.fighters.forEach((f) => { f.state = 'idle'; });
      game.debug = true; for (let i = 0; i < 90; i++) { game.update(); draw(i, 30); } game.draw(); game.debug = false; out.scenes.training = 'ok';
    });
  }

  if (mode === 'all' || mode === 'moves') {
    const keys = ['punch', 'kick', 'cpunch', 'sweep', 'jpunch', 'jkick', 'special', 'special2', 'super'];
    CHARACTERS.forEach((ch, i) => {
      keys.forEach((key) => {
        safe(`move ${ch.id}.${key}`, () => {
          game.mode = '2p'; game.select.p1 = i; game.select.p2 = (i + 1) % CHARACTERS.length; game.stageIndex = i % STAGES.length; game.seed = seed;
          game.startMatch(); game.phase = 'play'; game.fighters.forEach((f) => { f.state = 'idle'; });
          const a = game.fighters[0], b = game.fighters[1];
          const m = a.moves[key]; if (!m) { out.moves.push({ ch: ch.id, move: key, dmg: -1, missing: true }); return; }
          if (m.counter) { out.moves.push({ ch: ch.id, move: key, name: m.name, dmg: 1, counter: true }); return; }   // posturas não causam dano por si
          const ranged = (m.projectile || m.projectiles || m.volley) && !m.hitbox;
          const dist = !ranged ? 90 : (m.projectile && m.projectile.follow) ? 120 : 300;
          a.x = 500; b.x = 500 + dist; a.chi = 100;
          if (m.air) { a.airborne = true; a.vy = -14; a.y = CFG.GROUND - 1; a.state = 'jump'; }
          const hpBefore = b.hp;
          a.startAttack(m);
          let frames = 0;
          while (frames < 200 && game.phase === 'play') { game.update(); if (PARAMS.r === '3d') draw(frames, 20); frames++; }
          out.moves.push({ ch: ch.id, move: key, name: m.name, dmg: hpBefore - b.hp, aState: a.state, bState: b.state });
        });
      });
    });
  }

  if (mode === 'all' || mode === 'cpu') {
    safe('cpu fight', () => {
      const n = parseInt(PARAMS.n || '12000', 10);
      game.mode = 'cpu'; game.select.p1 = parseInt(PARAMS.p1 || '0', 10); game.select.p2 = parseInt(PARAMS.p2 || '2', 10); game.stageIndex = parseInt(PARAMS.stage || '0', 10); game.seed = seed;
      game.startMatch(); game.fighters[0].isCPU = true;
      let hits = 0, blocks = 0;
      const orig = Fighter.prototype.receiveHit;
      Fighter.prototype.receiveHit = function () { const r = orig.apply(this, arguments); if (r === 'hit') hits++; else blocks++; return r; };
      const seen = new Set();
      for (let i = 0; i < n; i++) { game.update(); if (PARAMS.r === '3d') draw(i, 10); seen.add(game.scene + ':' + game.phase); if (game.scene !== 'fight') break; }
      Fighter.prototype.receiveHit = orig;
      const [a, b] = game.fighters;
      out.cpuFight = { hits, blocks, scene: game.scene, phase: game.phase, round: game.round, hp: [a.hp, b.hp], rounds: [a.rounds, b.rounds], seen: [...seen], winner: game.winner ? game.winner.char.id : null, seed: game.matchSeed };
      game.draw();
    });
  }

  if (mode === 'shot') {
    safe('shot', () => {
      game.mode = '2p'; game.select.p1 = parseInt(PARAMS.p1 || '2', 10); game.select.p2 = parseInt(PARAMS.p2 || '3', 10); game.stageIndex = parseInt(PARAMS.stage || '0', 10); game.seed = seed;
      game.startMatch(); if (!PARAMS.intro) { game.phase = 'play'; game.announce = null; game.fighters.forEach((f) => { f.state = 'idle'; }); }
      const a = game.fighters[0], b = game.fighters[1];
      a.x = parseInt(PARAMS.ax || '420', 10); b.x = parseInt(PARAMS.bx || '820', 10); a.chi = 100;
      if (PARAMS.move) a.startAttack(a.moves[PARAMS.move]);
      const n = parseInt(PARAMS.frame || '24', 10);
      for (let i = 0; i < n; i++) { game.update(); draw(i, 4); }
      if (PARAMS.debug) game.debug = true;
      game.draw();
      out.shot = { proj: game.projectiles.map((p) => p.type), aState: a.state, bState: b.state, bHp: b.hp, phase: game.phase, phaseT: game.phaseT, announce: game.announce && game.announce.text, quotes: game.quotes && game.quotes.map((q) => q.intro) };
    });
  }

  if (mode === 'all' || mode === 'mechanics') {
    const mech = out.mechanics = {};
    const setup = (ax, bx, p1 = 2, p2 = 3) => {
      game.mode = '2p'; game.select.p1 = p1; game.select.p2 = p2; game.stageIndex = 0; game.seed = seed;
      game.startMatch(); game.phase = 'play'; game.announce = null; game.fighters.forEach((f) => { f.state = 'idle'; });
      const [a, b] = game.fighters; a.x = ax; b.x = bx; a.chi = 100;
      return [a, b];
    };
    let queue = []; game.padSourceA = () => queue.shift() || Input.emptyPad();
    const press = (keys) => Object.assign(Input.emptyPad(), keys);
    const run = (n) => { for (let i = 0; i < n; i++) game.update(); };

    safe('mech buffer', () => {
      const [a] = setup(500, 900);
      a.startAttack(a.moves.punch);            // soco: 4+4+9 = 17 frames
      run(10);                                 // em recuperação
      queue = [press({ kick: true })];         // chute apertado durante a recuperação
      run(11);                                 // o soco termina no frame 17; o chute deve sair sozinho
      mech.buffer = a.state === 'attack' && a.attack.key === 'kick';
    });
    safe('mech cancel', () => {
      const [a, b] = setup(500, 580);
      a.startAttack(a.moves.punch);
      run(5);                                  // frame 5 = primeiro frame ativo: acerta
      queue = [press({ special: true })];
      run(2 + 4);                              // 4 frames de hitstop congelam a luta após o acerto
      mech.cancel = a.state === 'attack' && a.attack.key === 'special' && b.state === 'hit';
    });
    safe('mech dash', () => {
      const [a] = setup(400, 900);
      queue = [press({ right: true }), press({}), press({}), press({ right: true })];
      run(4);
      mech.dash = a.state === 'dash' && a.dashVx > 0;
      const [c] = setup(400, 900);
      queue = [press({ left: true }), press({}), press({}), press({ left: true })];
      run(4);
      mech.backdash = c.state === 'dash' && c.dashVx < 0 && c.invulnFrames > 0;
    });
    safe('mech throw', () => {
      const [a, b] = setup(500, 570);
      const hp = b.hp;
      queue = [press({ punch: true, kick: true })];
      run(1);
      const grabbed = a.state === 'throw' && b.state === 'thrown';
      run(40);
      mech.throw = grabbed && hp - b.hp === THROW_DAMAGE && (b.state === 'knockdown' || b.launched || b.airborne);
    });
    safe('mech throwEscape', () => {
      const [a, b] = setup(500, 570);
      const hp = b.hp;
      const qb = [press({}), press({}), press({ punch: true, kick: true })];
      game.padSourceB = () => qb.shift() || Input.emptyPad();
      queue = [press({ punch: true, kick: true })];
      run(6);
      mech.throwEscape = b.hp === hp && a.state !== 'throw' && b.state !== 'thrown';
      game.padSourceB = null;
    });
    safe('mech throwBeatsBlock', () => {
      const [a, b] = setup(500, 570);
      game.padSourceB = () => press({ right: true });   // b segura para trás (bloqueando)
      const hp = b.hp;
      queue = [press({ punch: true, kick: true })];
      run(30);
      mech.throwBeatsBlock = hp - b.hp === THROW_DAMAGE;
      game.padSourceB = null;
    });
    safe('mech scaling', () => {
      const [a, b] = setup(500, 580);
      const dmgs = [];
      for (let i = 0; i < 3; i++) {
        b.x = 580; b.state = 'hit'; b.stun = 40; b.vx = 0; game.hitstop = 0; const hp = b.hp;
        a.state = 'idle'; a.attack = null; a.startAttack(a.moves.kick); run(10); dmgs.push(hp - b.hp);
      }
      mech.scaling = dmgs[0] === a.moves.kick.damage && dmgs[1] < dmgs[0] && dmgs[2] < dmgs[1];
      mech.scalingValues = dmgs;
    });
    safe('mech quickRise', () => {
      const [a, b] = setup(500, 580);
      a.startAttack(a.moves.sweep); run(60);
      const [c, d] = setup(500, 580);
      game.padSourceB = () => (d.state === 'knockdown' ? press({ up: true }) : Input.emptyPad());
      c.startAttack(c.moves.sweep); run(60);
      mech.quickRise = d.state !== 'knockdown' && (b.state === 'knockdown' || b.state === 'getup');
      mech.quickRiseStates = [b.state, d.state];
      game.padSourceB = null;
    });
    safe('mech cornerPush', () => {
      const [a, b] = setup(1140, 1240);   // b encostado na parede direita
      const ax = a.x;
      a.startAttack(a.moves.kick); run(20);
      mech.cornerPush = a.x < ax - 2;
    });
    safe('mech chiBlock', () => {
      const [a, b] = setup(500, 580, 0, 2);
      b.chiBlocked = 300; b.chi = 100;
      const qb = [press({ special: true })]; game.padSourceB = () => qb.shift() || Input.emptyPad();
      run(3);
      mech.chiBlock = b.state !== 'attack';
      game.padSourceB = null;
    });
    game.padSourceA = null; game.padSourceB = null;
  }

  if (mode === 'all' || mode === 'modes') {
    const md = out.modes = {};
    const runUntilSceneChange = (max) => { const sc = game.scene; for (let i = 0; i < max && game.scene === sc; i++) game.update(); return game.scene; };
    safe('arcade', () => {
      game.mode = 'arcade'; game.select = { p1: 0, p2: 1, p1Done: false, p2Done: false, timer: 0 }; game.seed = seed;
      game.startArcade();
      const scenes = []; let guard = 0;
      while (guard++ < 12 && game.scene === 'ladder') {
        scenes.push('ladder:' + game.arcade.ladder[game.arcade.index]);
        game.ladderT = 400; game.update();                              // começa a luta automaticamente
        if (game.scene !== 'fight') break;
        game.fighters[0].isCPU = true; game.fighters[0].aiLevel = 'hard'; game.fighters[1].aiLevel = 'easy';
        game.fighters[0].hp = 100; game.fighters[1].maxHp = 20; game.fighters[1].hp = 20; game.fighters[1].hpGhost = 20;   // encurta a luta a favor do P1
        for (let r = 0; r < 3 && game.scene === 'fight'; r++) { runUntilSceneChange(40000); }
        scenes.push(game.scene);
        if (game.scene === 'continue') { game.continueIndex = 0; game.continueT = 30; game.update(); game.scene = 'ladder'; }
      }
      md.arcade = { scenes, reachedEnding: game.scene === 'ending', score: game.arcade.score, fights: game.arcade.index };
      game.draw();
    });
    safe('survival', () => {
      game.mode = 'survival'; game.select = { p1: 2, p2: 1, p1Done: false, p2Done: false, timer: 0 }; game.seed = seed;
      game.startSurvival();
      let wins = 0, guard = 0;
      while (guard++ < 4 && game.scene === 'ladder') {
        game.ladderT = 400; game.update();
        if (game.scene !== 'fight') break;
        game.fighters[0].isCPU = true;
        if (guard < 3) { game.fighters[1].maxHp = 15; game.fighters[1].hp = 15; game.fighters[1].hpGhost = 15; } else { game.fighters[0].maxHp = 10; game.fighters[0].hp = 10; game.fighters[0].hpGhost = 10; game.fighters[1].hp = 100; }
        runUntilSceneChange(40000);
        if (game.scene === 'ladder') wins = game.survival.wins;
      }
      md.survival = { wins, ended: game.scene === 'survivalEnd', hpCarry: game.survival.hpCarry, best: game.survival.best };
      game.draw();
    });
    game.aiLevelOverride = null;
  }

  if (mode === 'all' || mode === 'v07') {
    const v = out.v07 = {};
    const press = (keys) => Object.assign(Input.emptyPad(), keys);
    const run = (n) => { for (let i = 0; i < n; i++) game.update(); };
    const setup = (p1, p2, mods, dist) => {
      game.mode = '2p'; game.select = { p1, p2, p1Done: true, p2Done: true, timer: 0, skin1: 0, skin2: 0, msg: '' }; game.stageIndex = 0; game.seed = seed;
      game.modifiers = mods.slice(); game.startMatch(); game.phase = 'play'; game.announce = null; game.fighters.forEach((f) => { f.state = 'idle'; });
      const [a, b] = game.fighters; a.x = 500; b.x = 500 + (dist || 90); a.chi = 100; return [a, b];
    };
    // regras
    safe('v07 eclipse', () => {
      const [a, b] = setup(2, 3, ['eclipse'], 300);
      let qa = [press({ special: true })]; game.padSourceA = () => qa.shift() || Input.emptyPad();
      run(4); const zukoBlocked = a.state !== 'attack' && a.noBending === true;
      let qb = [press({ special: true })]; game.padSourceB = () => qb.shift() || Input.emptyPad();
      run(4); const tophFree = b.state === 'attack';
      game.padSourceA = game.padSourceB = null; v.eclipse = zukoBlocked && tophFree;
    });
    safe('v07 luaCheia', () => {
      const [a, b] = setup(1, 2, ['luaCheia']); a.startAttack(a.moves.kick); run(12); const boosted = 100 - b.hp;
      const [c, d] = setup(1, 2, []); c.startAttack(c.moves.kick); run(12); const base = 100 - d.hp;
      v.luaCheia = base === 8 && boosted === 10; v.luaCheiaValues = [base, boosted];
    });
    safe('v07 cometa', () => {
      const [a, b] = setup(2, 3, ['cometa'], 300); a.startAttack(a.moves.special); run(12);
      const p = game.projectiles.find((x) => x.type === 'fire'); const w = p ? p.w : 0;
      run(60); v.cometa = w === 76 && 100 - b.hp === 15; v.cometaValues = [w, 100 - b.hp];
    });
    safe('v07 tempestade', () => {
      const [a, b] = setup(0, 5, ['tempestade'], 400); const seen = new Set(); let moved = false; const ax = a.x;
      for (let i = 0; i < 700; i++) { game.update(); for (const p of game.projectiles) seen.add(p.type); if (a.x !== ax) moved = true; if (game.phase !== 'play') break; }
      v.tempestade = seen.has('bolt') && moved; v.tempestadeTypes = [...seen];
    });
    safe('v07 vidaContinua', () => {
      const [a, b] = setup(2, 3, ['vidaContinua']); a.hp = 40; a.hpGhost = 40; b.hp = 1;
      a.startAttack(a.moves.kick); let guard = 0; while (game.round === 1 && guard++ < 1200) game.update();
      v.vidaContinua = game.round === 2 && game.fighters[0].hp === 40; v.vidaContinuaHp = game.fighters[0].hp;
    });
    safe('v07 tempoCurto', () => { setup(0, 1, ['tempoCurto']); v.tempoCurto = game.timer === 30; });
    safe('v07 superInfinito', () => { const [a, b] = setup(0, 1, ['superInfinito']); a.chi = 0; b.chi = 0; run(2); v.superInfinito = a.chi === 100 && b.chi === 100; });
    game.modifiers = [];
    // salvamento
    safe('v07 save', () => {
      Save.reset(); Save.recordMatch('aang', 'zuko', 'cpu'); Save.recordMatch('aang', 'zuko', 'cpu');
      const wins = Save.data.stats.wins.aang === 2 && Save.data.stats.matches === 2;
      localStorage.setItem('avatarArena.save', '{corrompido'); Save.load();
      const recovered = Save.data.schema === Save.SCHEMA && Save.data.stats.matches === 0 && !!localStorage.getItem('avatarArena.save.bak');
      localStorage.removeItem('avatarArena.save'); localStorage.setItem('avatarArena.survivalBest', '7'); Save.load();
      const legacy = Save.data.stats.survivalBest === 7;
      const migrated = Save.migrate({ stats: { matches: 5 } }); const mig = migrated.schema === Save.SCHEMA && migrated.stats.matches === 5 && !!migrated.unlocks;
      v.save = wins && recovered && legacy && mig; v.saveParts = [wins, recovered, legacy, mig];
      Save.reset();
    });
    // trajes
    safe('v07 skins', () => {
      Save.reset(); const ch = CHARACTERS[0]; const list = skinList(ch);
      const lockedAtStart = list.length === 3 && !skinUnlocked(ch, list[1]) && !skinUnlocked(ch, list[2]);
      Save.data.stats.wins.aang = 5; const u1 = checkUnlocks(); const treino = u1.some((u) => u.char.id === 'aang' && u.skin.id === 'treino');
      Save.data.stats.arcadeWins.aang = 1; const u2 = checkUnlocks(); const tema = u2.some((u) => u.char.id === 'aang' && u.skin.id === 'nacaoFogo');
      const sc = skinnedChar(ch, 1), again = skinnedChar(ch, 1);
      const colors = sc.colors.primary !== ch.colors.primary && sc === again && skinnedChar(ch, 0) === ch;
      v.skins = lockedAtStart && treino && tema && colors && skinUnlocked(ch, list[1]); Save.reset();
    });
    // desafio diário
    safe('v07 daily', () => {
      Save.reset(); game._daily = null; const d1 = game.dailyChallenge(); game._daily = null; const d2 = game.dailyChallenge();
      const stable = JSON.stringify(d1) === JSON.stringify(d2) && d1.p1 !== d1.p2 && d1.mods.length >= 1;
      game.startDaily(); const started = game.mode === 'daily' && game.modifiers.length === d1.mods.length && game.fighters[1].aiLevel === 'hard';
      game.fighters[0].isCPU = true; game.fighters[1].maxHp = 5; game.fighters[1].hp = 5; game.fighters[1].hpGhost = 5;
      let guard = 0; while (game.scene === 'fight' && guard++ < 40000) game.update();
      const rec = Save.data.daily[d1.key];
      v.daily = stable && started && game.scene === 'daily' && !!rec && rec.tries === 1; v.dailyRec = rec;
      game.fighters[0].isCPU = false; game.aiLevelOverride = null; game.modifiers = []; Save.reset();
    });
    // torneio
    safe('v07 tournament', () => {
      Save.reset(); game.startTournamentSetup(); game.tournament.size = 4; game.tournament.slots.forEach((s) => { s.cpu = true; });
      game.buildBracket(); let guard = 0;
      while (game.tournament.champion === null && guard++ < 10) { game.startNextTournamentMatch(); }
      const t = game.tournament;
      v.tournament = t.champion !== null && t.bracket.length === 2 && Save.data.tournament.champions.length === 1 && game.scene === 'bracket';
      v.tournamentChampion = t.champion; game.scene = 'title'; game.mode = '2p'; Save.reset();
    });
    game.seed = null; game.modifiers = []; game.aiLevelOverride = null;
  }

  if (mode === 'all' || mode === 'netplay') {
    safe('netplay', () => {
      const cv2 = document.createElement('canvas'); cv2.width = 1280; cv2.height = 720;
      const g1 = game, g2 = new Game(cv2);
      const lb = loopbackPair(2);
      const s1 = new NetSession('host', lb.a), s2 = new NetSession('guest', lb.b);
      g1.net = s1; g2.net = s2; g1.netStalled = g2.netStalled = 0;
      s2.onStart = (cfg) => g2.netStartMatch(cfg);
      const cfg = { p1: 2, p2: 3, stage: 0, seed: 4242 };
      s1.send({ t: 'start', cfg }); g1.netStartMatch(cfg);
      lb.pump(); lb.pump(); lb.pump();
      const mk = (seed) => { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
      const script = (r) => () => { const p = r(); const pad = Input.emptyPad(); pad.right = p < 0.35; pad.left = p > 0.85; pad.punch = p > 0.35 && p < 0.42; pad.kick = p >= 0.42 && p < 0.48; pad.special = p >= 0.48 && p < 0.52; pad.down = p >= 0.6 && p < 0.7; pad.upPressed = p >= 0.7 && p < 0.72; pad.up = pad.upPressed; return pad; };
      g1.netLocalPad = script(mk(7)); g2.netLocalPad = script(mk(99));
      let mismatch = null, stalls = 0, lastHit = 0;
      for (let i = 0; i < 2000; i++) {
        g1.update(); g2.update(); lb.pump();
        if (g1.scene !== 'fight' || g2.scene !== 'fight') break;
        if (s1.frame !== s2.frame) stalls++;
        else if (!mismatch) for (let k = 0; k < 2; k++) { const a = g1.fighters[k], b = g2.fighters[k]; if (a.x !== b.x || a.y !== b.y || a.hp !== b.hp || a.state !== b.state || a.chi !== b.chi) mismatch = { frame: s1.frame, k, a: [a.x, a.y, a.hp, a.state], b: [b.x, b.y, b.hp, b.state] }; }
        if (g1.fighters[1].hp < 100 || g1.fighters[0].hp < 100) lastHit = s1.frame;
      }
      g1.netLocalPad = g2.netLocalPad = null; g1.net = null; g2.net = null; g1.mode = '2p';
      out.netplay = { frames: [s1.frame, s2.frame], stalls, mismatch, hpG1: [g1.fighters[0].hp, g1.fighters[1].hp], hpG2: [g2.fighters[0].hp, g2.fighters[1].hp], damageHappened: lastHit > 0, ok: !mismatch && s1.frame >= 1500 && lastHit > 0 };
    });
  }

  if (mode === 'matchups') {
    safe('matchups', () => {
      const per = parseInt(PARAMS.pairs || '6', 10), maxFrames = 30000;
      const ids = CHARACTERS.map((c) => c.id), n = ids.length;
      const wins = {}; ids.forEach((id) => { wins[id] = { w: 0, l: 0 }; });
      const table = [];
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        let wi = 0, wj = 0;
        for (let k = 0; k < per; k++) {
          game.mode = 'cpu'; game.select.p1 = k % 2 ? j : i; game.select.p2 = k % 2 ? i : j; game.stageIndex = k % STAGES.length; game.seed = seed + i * 1000 + j * 31 + k;
          game.startMatch(); game.fighters[0].isCPU = true;
          for (let f = 0; f < maxFrames && game.scene === 'fight'; f++) game.update();
          const w = game.winner ? game.winner.char.id : null;
          if (w === ids[i]) wi++; else if (w === ids[j]) wj++;
        }
        wins[ids[i]].w += wi; wins[ids[i]].l += wj; wins[ids[j]].w += wj; wins[ids[j]].l += wi;
        table.push({ a: ids[i], b: ids[j], aWins: wi, bWins: wj });
      }
      out.matchups = { per, table, rates: Object.fromEntries(ids.map((id) => [id, { games: wins[id].w + wins[id].l, rate: wins[id].w / Math.max(1, wins[id].w + wins[id].l) }])) };
    });
  }

  if (PARAMS.scene && PARAMS.scene !== 'fight') safe('final scene', () => { if (PARAMS.scene === 'remap') game.remap = { player: 'p1', index: 4, listening: true, message: '' }; if (PARAMS.scene === 'result') { game.winner = game.fighters[0]; game.fighters[0].stats.hits = 23; game.fighters[0].stats.maxCombo = 4; game.fighters[0].stats.damage = 210; game.fighters[1].stats.hits = 11; game.fighters[1].stats.damage = 96; game.fighters[1].stats.throws = 1; } if (PARAMS.scene === 'rules') game.gotoRules(); if (PARAMS.scene === 'tournamentSetup') game.startTournamentSetup(); if (PARAMS.scene === 'bracket') { game.startTournamentSetup(); game.tournament.slots.forEach((s) => { s.cpu = true; }); game.buildBracket(); } if (PARAMS.scene === 'ladder') { game.mode = 'arcade'; game.select.p1 = parseInt(PARAMS.p1 || '0', 10); game.startArcade(); } game.scene = PARAMS.scene; for (let i = 0; i < 30; i++) game.update(); game.draw(); });
  document.getElementById('log').textContent = JSON.stringify(out);
})();
</script>
